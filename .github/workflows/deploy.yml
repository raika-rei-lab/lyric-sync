name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数回のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: ビルド（base=/lyric-sync/）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages はプロジェクトページ（https://<user>.github.io/<repo>/）で配信されるため、
      # アセットのベースパスにリポジトリ名を含める必要があります。
      # ローカル開発・CI では base='/' のままなので、ここだけで付与します。
      - name: ビルド
        run: npx vite build --base=/lyric-sync/

      - name: 出力に base パスのembedを確認
        run: |
          echo "--- dist/index.html のアセット参照 ---"
          grep -oE '(src|href)="[^"]+"' dist/index.html
          echo "--- Worker ファイル ---"
          ls -1 dist/assets/asr-worker-*.js
          echo "--- 参照先が /lyric-sync/ になっているか ---"
          grep -q '/lyric-sync/assets/' dist/index.html || { echo "base パスが含まれていません"; exit 1; }
          grep -q '/lyric-sync/assets/asr-worker-' dist/assets/*.js || {
            echo "Worker のパスに base が含まれていません"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: デプロイ
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4